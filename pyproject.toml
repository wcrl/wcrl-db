[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcrl-db"
version = "0.1.0"
description = "Shared SQLite data-access library for WCRL's Discord bot and backend API"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["wcrl_db*"]

[tool.setuptools.package-data]
wcrl_db = ["schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
